; ============================================
; NORCOM INFRASTRUCTURE - PRODUCTION INVENTORY
; ============================================

; ===== PFSENSE ROUTERS (CARP Failover)a =====
[pfsense_router_master]
pfsense-master ansible_host=172.17.25.86

[pfsense_router_backup]
pfsense-backup ansible_host=172.17.25.87

[pfsense_routers:children]
pfsense_router_master
pfsense_router_backup

[pfsense_routers:vars]
ansible_connection=ssh
ansible_shell_type=csh
ansible_shell_executable=/bin/tcsh
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3'

; ===== UBUNTU ROUTERS (VRRP - DEPRECATED) =====
[ubuntu_router_master]
uburomas ansible_host=192.168.10.2

[ubuntu_router_backup]
uburoba ansible_host=192.168.10.3

[ubuntu_routers:children]
ubuntu_router_master
ubuntu_router_backup

[ubuntu_routers:vars]
ansible_become=true
ansible_python_interpreter=/usr/bin/python3
ansible_connection=ssh

; ===== ISP2 CREATOR =====
[isp2_creator]
isp2 ansible_host=172.17.25.35

[isp2_creator:vars]
ansible_become=true
ansible_python_interpreter=/usr/bin/python3
ansible_connection=ssh

; ===== LINUX SERVERS =====
[ubuntu_dns_secondary]
dns2 ansible_host=192.168.10.6

[ubuntu_file_server]
ubufs ansible_host=192.168.10.7 ansible_user=ubufs

[ubuntu_mail]
ubumail ansible_host=192.168.10.9

[zabbix_server]
zabbix ansible_host=192.168.10.10

[linux_servers:children]
ubuntu_dns_secondary
ubuntu_file_server
ubuntu_mail
zabbix_server

[linux_servers:vars]
ansible_become=true
ansible_python_interpreter=/usr/bin/python3
ansible_connection=ssh

; ===== WINDOWS SERVERS =====
[windows_local]
win1 ansible_host=192.168.10.5

[windows_domain]
win1 ansible_host=192.168.10.5

[windows:children]
windows_local
windows_domain

[windows:vars]
ansible_connection=winrm
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore
ansible_port=5985
ansible_winrm_operation_timeout_sec=120
ansible_winrm_read_timeout_sec=180

[windows_local:vars]
ansible_user=.\Administrador

[windows_domain:vars]
ansible_user=NORCOM\Administrador

; ===== ESXI HYPERVISORS =====
[esxi_hosts]
esxi1 ansible_host=172.17.25.20

[esxi_hosts:vars]
ansible_connection=local
