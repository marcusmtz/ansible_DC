---
- name: Resetear contrasena root de MariaDB via modo recovery
  hosts: "{{ target_hosts | default('ubuntu_mail') }}"
  become: true

  vars:
    new_root_password: "PasswordSeguroMySQL2026!"

  tasks:
    - name: Crear directorio de override para MariaDB
      ansible.builtin.file:
        path: /etc/systemd/system/mariadb.service.d
        state: directory
        mode: '0755'

    - name: Crear override para arrancar sin autenticacion
      ansible.builtin.copy:
        dest: /etc/systemd/system/mariadb.service.d/recover.conf
        mode: '0644'
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/sbin/mysqld --skip-grant-tables --skip-networking

    - name: Recargar systemd y reiniciar MariaDB en modo recovery
      ansible.builtin.systemd:
        name: mariadb
        state: restarted
        daemon_reload: true

    - name: Esperar a que MariaDB este listo
      ansible.builtin.wait_for:
        path: /run/mysqld/mysqld.sock
        timeout: 30

    - name: Resetear contrasena de root y cambiar plugin a mysql_native_password
      ansible.builtin.shell: |
        mysql -u root << 'ENDSQL'
        FLUSH PRIVILEGES;
        UPDATE mysql.global_priv
          SET priv=JSON_SET(priv,
            '$.plugin', 'mysql_native_password',
            '$.authentication_string', PASSWORD('{{ new_root_password }}'))
          WHERE user='root' AND host='localhost';
        FLUSH PRIVILEGES;
        ENDSQL
      changed_when: true

    - name: Eliminar override de recovery
      ansible.builtin.file:
        path: /etc/systemd/system/mariadb.service.d/recover.conf
        state: absent

    - name: Volver a modo normal
      ansible.builtin.systemd:
        name: mariadb
        state: restarted
        daemon_reload: true

    - name: Esperar a que MariaDB este listo en modo normal
      ansible.builtin.wait_for:
        path: /run/mysqld/mysqld.sock
        timeout: 30

    - name: Verificar que la nueva contrasena funciona
      ansible.builtin.shell: |
        mysql -u root -p'{{ new_root_password }}' -e "SELECT user, host, plugin FROM mysql.global_priv WHERE user='root';"
      no_log: true
      changed_when: false
      register: root_verify

    - name: Mostrar resultado de la verificacion
      ansible.builtin.debug:
        msg: "{{ root_verify.stdout_lines }}"
