---
- name: Configurar Ubuntu Router BACKUP con balanceo ECMP, VRRP y VLANs
  hosts: ubuntu_router_backup
  become: true

  vars:
    wan_interface: ens34
    wan1_address: "172.17.25.66/24"
    wan1_gateway: "172.17.25.121"
    wan2_interface: ens35
    wan2_address: "168.17.25.3/29"
    wan2_gateway: "168.17.25.1"

    # Trunk LAN - sin IP propia
    trunk_interface: ens36

    # VLANs con VLSM
    vlans:
      - id: 10
        name: servidores
        address: "192.168.10.3/26"
        vip: "192.168.10.1/26"
        vrrp_id: 10
        subnet_mask: "255.255.255.192"
        network: "192.168.10.0/26"
        usable_range: "192.168.10.1 - 192.168.10.62"
        max_hosts: 62
      - id: 20
        name: administracion
        address: "192.168.20.3/25"
        vip: "192.168.20.1/25"
        vrrp_id: 20
        subnet_mask: "255.255.255.128"
        network: "192.168.20.0/25"
        usable_range: "192.168.20.1 - 192.168.20.126"
        max_hosts: 126
      - id: 30
        name: ti
        address: "192.168.30.3/26"
        vip: "192.168.30.1/26"
        vrrp_id: 30
        subnet_mask: "255.255.255.192"
        network: "192.168.30.0/26"
        usable_range: "192.168.30.1 - 192.168.30.62"
        max_hosts: 62
      - id: 40
        name: ventas
        address: "192.168.40.3/25"
        vip: "192.168.40.1/25"
        vrrp_id: 40
        subnet_mask: "255.255.255.128"
        network: "192.168.40.0/25"
        usable_range: "192.168.40.1 - 192.168.40.126"
        max_hosts: 126

    dhcp_server: "192.168.10.5"

    vrrp_state: BACKUP
    vrrp_priority: 100
    vrrp_auth_pass: VRRP_PASS_2024
    netplan_file: /etc/netplan/00-installer-config.yaml
    nameservers:
      - "8.8.8.8"
      - "1.1.1.1"
      - "192.168.13.96"
      - "192.168.13.97"

    sync_local_ip: "192.168.10.3"
    sync_peer_ip: "192.168.10.2"

  tasks:
    - name: Instalar paquetes necesarios
      ansible.builtin.apt:
        name:
          - iptables
          - iptables-persistent
          - netfilter-persistent
          - keepalived
          - vlan
          - isc-dhcp-relay
          - conntrackd
          - fping
        state: present
        update_cache: true

    - name: Cargar modulo 8021q para VLANs
      community.general.modprobe:
        name: 8021q
        state: present

    - name: Persistir modulo 8021q
      ansible.builtin.lineinfile:
        path: /etc/modules
        line: 8021q
        state: present

    - name: Escribir netplan con trunk y subinterfaces VLAN
      ansible.builtin.copy:
        dest: "{{ netplan_file }}"
        owner: root
        group: root
        mode: "0600"
        backup: true
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              {{ wan_interface }}:
                dhcp4: false
                addresses: [{{ wan1_address }}]
                nameservers:
                  addresses: {{ nameservers | to_json }}
              {{ wan2_interface }}:
                dhcp4: false
                addresses: [{{ wan2_address }}]
              {{ trunk_interface }}:
                dhcp4: false
            vlans:
          {% for vlan in vlans %}
              {{ trunk_interface }}.{{ vlan.id }}:
                id: {{ vlan.id }}
                link: {{ trunk_interface }}
                dhcp4: false
                addresses: [{{ vlan.address }}]
          {% endfor %}
      notify: Apply netplan

    - name: Forzar aplicacion de netplan antes de continuar
      ansible.builtin.meta: flush_handlers

    - name: Activar IPv4 forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        reload: true

    # --- NAT hacia WAN ---
    - name: NAT MASQUERADE WAN1
      ansible.builtin.shell: |
        if iptables -t nat -C POSTROUTING -o {{ wan_interface }} -j MASQUERADE 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -t nat -A POSTROUTING -o {{ wan_interface }} -j MASQUERADE
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: nat_wan1
      changed_when: "'ADDED' in nat_wan1.stdout"

    - name: NAT MASQUERADE WAN2
      ansible.builtin.shell: |
        if iptables -t nat -C POSTROUTING -o {{ wan2_interface }} -j MASQUERADE 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -t nat -A POSTROUTING -o {{ wan2_interface }} -j MASQUERADE
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: nat_wan2
      changed_when: "'ADDED' in nat_wan2.stdout"

    # --- FORWARD VLANs hacia WAN ---
    - name: Permitir forwarding VLAN hacia WAN
      ansible.builtin.shell: |
        changed=0
        if ! iptables -C FORWARD -i {{ trunk_interface }}.{{ item.id }} -o {{ wan_interface }} -j ACCEPT 2>/dev/null; then
          iptables -A FORWARD -i {{ trunk_interface }}.{{ item.id }} -o {{ wan_interface }} -j ACCEPT
          changed=1
        fi
        if ! iptables -C FORWARD -i {{ trunk_interface }}.{{ item.id }} -o {{ wan2_interface }} -j ACCEPT 2>/dev/null; then
          iptables -A FORWARD -i {{ trunk_interface }}.{{ item.id }} -o {{ wan2_interface }} -j ACCEPT
          changed=1
        fi
        [ $changed -eq 1 ] && echo "ADDED" || echo "EXISTS"
      loop: "{{ vlans }}"
      args:
        executable: /bin/bash
      register: fwd_vlan_wan
      changed_when: "'ADDED' in fwd_vlan_wan.stdout"

    - name: Permitir trafico de retorno WAN hacia VLANs
      ansible.builtin.shell: |
        changed=0
        if ! iptables -C FORWARD -i {{ wan_interface }} -o {{ trunk_interface }}.{{ item.id }} -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null; then
          iptables -A FORWARD -i {{ wan_interface }} -o {{ trunk_interface }}.{{ item.id }} -m state --state RELATED,ESTABLISHED -j ACCEPT
          changed=1
        fi
        if ! iptables -C FORWARD -i {{ wan2_interface }} -o {{ trunk_interface }}.{{ item.id }} -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null; then
          iptables -A FORWARD -i {{ wan2_interface }} -o {{ trunk_interface }}.{{ item.id }} -m state --state RELATED,ESTABLISHED -j ACCEPT
          changed=1
        fi
        [ $changed -eq 1 ] && echo "ADDED" || echo "EXISTS"
      loop: "{{ vlans }}"
      args:
        executable: /bin/bash
      register: ret_wan_vlan
      changed_when: "'ADDED' in ret_wan_vlan.stdout"

    # --- Politicas inter-VLAN ---
    # Administracion (VLAN20) tiene acceso completo a todo
    - name: Permitir Administracion (VLAN20) acceder a Servidores (VLAN10)
      ansible.builtin.shell: |
        if iptables -C FORWARD -i {{ trunk_interface }}.20 -o {{ trunk_interface }}.10 -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A FORWARD -i {{ trunk_interface }}.20 -o {{ trunk_interface }}.10 -j ACCEPT
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: fwd_v20_v10
      changed_when: "'ADDED' in fwd_v20_v10.stdout"

    - name: Permitir Administracion (VLAN20) acceder a TI (VLAN30)
      ansible.builtin.shell: |
        if iptables -C FORWARD -i {{ trunk_interface }}.20 -o {{ trunk_interface }}.30 -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A FORWARD -i {{ trunk_interface }}.20 -o {{ trunk_interface }}.30 -j ACCEPT
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: fwd_v20_v30
      changed_when: "'ADDED' in fwd_v20_v30.stdout"

    - name: Permitir Administracion (VLAN20) acceder a Ventas (VLAN40)
      ansible.builtin.shell: |
        if iptables -C FORWARD -i {{ trunk_interface }}.20 -o {{ trunk_interface }}.40 -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A FORWARD -i {{ trunk_interface }}.20 -o {{ trunk_interface }}.40 -j ACCEPT
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: fwd_v20_v40
      changed_when: "'ADDED' in fwd_v20_v40.stdout"

    - name: Permitir TI (VLAN30) acceder a Servidores (VLAN10)
      ansible.builtin.shell: |
        if iptables -C FORWARD -i {{ trunk_interface }}.30 -o {{ trunk_interface }}.10 -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A FORWARD -i {{ trunk_interface }}.30 -o {{ trunk_interface }}.10 -j ACCEPT
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: fwd_v30_v10
      changed_when: "'ADDED' in fwd_v30_v10.stdout"

    - name: Permitir TI (VLAN30) acceder a Administracion (VLAN20)
      ansible.builtin.shell: |
        if iptables -C FORWARD -i {{ trunk_interface }}.30 -o {{ trunk_interface }}.20 -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A FORWARD -i {{ trunk_interface }}.30 -o {{ trunk_interface }}.20 -j ACCEPT
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: fwd_v30_v20
      changed_when: "'ADDED' in fwd_v30_v20.stdout"

    - name: Permitir TI (VLAN30) acceder a Ventas (VLAN40)
      ansible.builtin.shell: |
        if iptables -C FORWARD -i {{ trunk_interface }}.30 -o {{ trunk_interface }}.40 -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A FORWARD -i {{ trunk_interface }}.30 -o {{ trunk_interface }}.40 -j ACCEPT
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: fwd_v30_v40
      changed_when: "'ADDED' in fwd_v30_v40.stdout"

    - name: Permitir Ventas (VLAN40) acceder a Servidores (VLAN10)
      ansible.builtin.shell: |
        if iptables -C FORWARD -i {{ trunk_interface }}.40 -o {{ trunk_interface }}.10 -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A FORWARD -i {{ trunk_interface }}.40 -o {{ trunk_interface }}.10 -j ACCEPT
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: fwd_v40_v10
      changed_when: "'ADDED' in fwd_v40_v10.stdout"

    - name: Bloquear Ventas (VLAN40) hacia Administracion (VLAN20)
      ansible.builtin.shell: |
        if iptables -C FORWARD -i {{ trunk_interface }}.40 -o {{ trunk_interface }}.20 -j DROP 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A FORWARD -i {{ trunk_interface }}.40 -o {{ trunk_interface }}.20 -j DROP
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: drop_v40_v20
      changed_when: "'ADDED' in drop_v40_v20.stdout"

    - name: Bloquear Ventas (VLAN40) hacia TI (VLAN30)
      ansible.builtin.shell: |
        if iptables -C FORWARD -i {{ trunk_interface }}.40 -o {{ trunk_interface }}.30 -j DROP 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A FORWARD -i {{ trunk_interface }}.40 -o {{ trunk_interface }}.30 -j DROP
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: drop_v40_v30
      changed_when: "'ADDED' in drop_v40_v30.stdout"

    - name: Permitir respuestas de Servidores hacia todas las VLANs
      ansible.builtin.shell: |
        changed=0
        for vlan_id in 20 30 40; do
          if ! iptables -C FORWARD -i {{ trunk_interface }}.10 -o {{ trunk_interface }}.${vlan_id} -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null; then
            iptables -A FORWARD -i {{ trunk_interface }}.10 -o {{ trunk_interface }}.${vlan_id} -m state --state RELATED,ESTABLISHED -j ACCEPT
            changed=1
          fi
        done
        [ $changed -eq 1 ] && echo "ADDED" || echo "EXISTS"
      args:
        executable: /bin/bash
      register: ret_v10_all
      changed_when: "'ADDED' in ret_v10_all.stdout"

    - name: Permitir respuestas entre VLANs administrativas
      ansible.builtin.shell: |
        changed=0
        if ! iptables -C FORWARD -i {{ trunk_interface }}.30 -o {{ trunk_interface }}.20 -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null; then
          iptables -A FORWARD -i {{ trunk_interface }}.30 -o {{ trunk_interface }}.20 -m state --state RELATED,ESTABLISHED -j ACCEPT
          changed=1
        fi
        if ! iptables -C FORWARD -i {{ trunk_interface }}.40 -o {{ trunk_interface }}.20 -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null; then
          iptables -A FORWARD -i {{ trunk_interface }}.40 -o {{ trunk_interface }}.20 -m state --state RELATED,ESTABLISHED -j ACCEPT
          changed=1
        fi
        if ! iptables -C FORWARD -i {{ trunk_interface }}.40 -o {{ trunk_interface }}.30 -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null; then
          iptables -A FORWARD -i {{ trunk_interface }}.40 -o {{ trunk_interface }}.30 -m state --state RELATED,ESTABLISHED -j ACCEPT
          changed=1
        fi
        [ $changed -eq 1 ] && echo "ADDED" || echo "EXISTS"
      args:
        executable: /bin/bash
      register: ret_vlans
      changed_when: "'ADDED' in ret_vlans.stdout"

    - name: Permitir trafico VRRP en subinterfaces VLAN
      ansible.builtin.shell: |
        if iptables -C INPUT -i {{ trunk_interface }}.{{ item.id }} -p vrrp -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A INPUT -i {{ trunk_interface }}.{{ item.id }} -p vrrp -j ACCEPT
          echo "ADDED"
        fi
      loop: "{{ vlans }}"
      args:
        executable: /bin/bash
      register: vrrp_input
      changed_when: "'ADDED' in vrrp_input.stdout"

    # --- DHCP Relay ---
    - name: Permitir DHCP relay en interfaces de clientes (INPUT UDP 67)
      ansible.builtin.shell: |
        if iptables -C INPUT -i {{ trunk_interface }}.{{ item.id }} -p udp --dport 67 -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A INPUT -i {{ trunk_interface }}.{{ item.id }} -p udp --dport 67 -j ACCEPT
          echo "ADDED"
        fi
      loop: "{{ vlans | selectattr('id', 'ne', 10) | list }}"
      args:
        executable: /bin/bash
      register: dhcp_input
      changed_when: "'ADDED' in dhcp_input.stdout"

    # --- Firewall INPUT ---
    - name: Permitir trafico establecido y relacionado en INPUT
      ansible.builtin.shell: |
        if iptables -C INPUT -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A INPUT -m state --state RELATED,ESTABLISHED -j ACCEPT
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: input_established
      changed_when: "'ADDED' in input_established.stdout"

    - name: Permitir trafico loopback en INPUT
      ansible.builtin.shell: |
        if iptables -C INPUT -i lo -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A INPUT -i lo -j ACCEPT
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: input_loopback
      changed_when: "'ADDED' in input_loopback.stdout"

    - name: Permitir SSH desde VLAN de servidores (VLAN10)
      ansible.builtin.shell: |
        if iptables -C INPUT -i {{ trunk_interface }}.10 -p tcp --dport 22 -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A INPUT -i {{ trunk_interface }}.10 -p tcp --dport 22 -j ACCEPT
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: input_ssh
      changed_when: "'ADDED' in input_ssh.stdout"

    - name: Permitir SSH desde TI (VLAN30)
      ansible.builtin.shell: |
        if iptables -C INPUT -i {{ trunk_interface }}.30 -p tcp --dport 22 -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A INPUT -i {{ trunk_interface }}.30 -p tcp --dport 22 -j ACCEPT
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: input_ssh_vlan30
      changed_when: "'ADDED' in input_ssh_vlan30.stdout"

    - name: Permitir SSH desde red de gestion WAN (172.17.25.0/24)
      ansible.builtin.shell: |
        if iptables -C INPUT -i {{ wan_interface }} -s 172.17.25.0/24 -p tcp --dport 22 -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A INPUT -i {{ wan_interface }} -s 172.17.25.0/24 -p tcp --dport 22 -j ACCEPT
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: input_ssh_wan
      changed_when: "'ADDED' in input_ssh_wan.stdout"

    - name: Permitir ICMP ping desde redes internas en INPUT
      ansible.builtin.shell: |
        if iptables -C INPUT -s 192.168.0.0/16 -p icmp --icmp-type echo-request -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A INPUT -s 192.168.0.0/16 -p icmp --icmp-type echo-request -j ACCEPT
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: input_icmp
      changed_when: "'ADDED' in input_icmp.stdout"

    - name: Permitir ICMP ping desde red de gestion WAN (172.17.25.0/24)
      ansible.builtin.shell: |
        if iptables -C INPUT -i {{ wan_interface }} -s 172.17.25.0/24 -p icmp --icmp-type echo-request -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A INPUT -i {{ wan_interface }} -s 172.17.25.0/24 -p icmp --icmp-type echo-request -j ACCEPT
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: input_icmp_wan
      changed_when: "'ADDED' in input_icmp_wan.stdout"

    - name: Permitir sync conntrackd entre nodos (UDP 3780 en VLAN10)
      ansible.builtin.shell: |
        if iptables -C INPUT -i {{ trunk_interface }}.10 -p udp --dport 3780 -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A INPUT -i {{ trunk_interface }}.10 -p udp --dport 3780 -j ACCEPT
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: conntrackd_sync_rule
      changed_when: "'ADDED' in conntrackd_sync_rule.stdout"

    - name: Establecer politicas por defecto (INPUT DROP, FORWARD DROP)
      ansible.builtin.shell: |
        changed=0
        if [ "$(iptables -S INPUT | head -1)" != "-P INPUT DROP" ]; then
          iptables -P INPUT DROP
          changed=1
        fi
        if [ "$(iptables -S FORWARD | head -1)" != "-P FORWARD DROP" ]; then
          iptables -P FORWARD DROP
          changed=1
        fi
        [ $changed -eq 1 ] && echo "CHANGED" || echo "EXISTS"
      args:
        executable: /bin/bash
      register: default_policies
      changed_when: "'CHANGED' in default_policies.stdout"

    - name: Configurar DHCP relay agent
      ansible.builtin.copy:
        dest: /etc/default/isc-dhcp-relay
        owner: root
        group: root
        mode: "0644"
        content: |
          SERVERS="{{ dhcp_server }}"
          INTERFACES="{% for vlan in vlans %}{{ trunk_interface }}.{{ vlan.id }}{% if not loop.last %} {% endif %}{% endfor %}"
          OPTIONS=""
      notify: Restart isc-dhcp-relay

    - name: Habilitar e iniciar DHCP relay
      ansible.builtin.systemd:
        name: isc-dhcp-relay
        enabled: true
        state: started

    # --- Policy Routing (WAN1_PRIMARY: Servidores+Admin | WAN2_PRIMARY: TI+Ventas) ---
    - name: Registrar tablas de routing personalizadas en rt_tables
      ansible.builtin.lineinfile:
        path: /etc/iproute2/rt_tables
        line: "{{ item }}"
        state: present
      loop:
        - "101 wan1_primary"
        - "102 wan2_primary"

    - name: Crear script de setup de policy routing
      ansible.builtin.copy:
        dest: /usr/local/bin/policy-routing-setup.sh
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          # Configura ip rules para policy routing por VLAN al arranque
          # Servidores(10)+Administracion(20) -> WAN1 | TI(30)+Ventas(40) -> WAN2

          # Limpiar rules previas para evitar duplicados
          ip rule list | awk -F: '/wan[12]_primary/{print $1}' | while read prio; do
            ip rule del priority "$prio" 2>/dev/null || true
          done

          ip rule add from 192.168.10.0/26 table wan1_primary priority 110
          ip rule add from 192.168.20.0/25 table wan1_primary priority 120
          ip rule add from 192.168.30.0/26 table wan2_primary priority 130
          ip rule add from 192.168.40.0/25 table wan2_primary priority 140

    - name: Crear script de failover WAN
      ansible.builtin.copy:
        dest: /usr/local/bin/wan-failover.sh
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          # Monitorea WANs y actualiza tablas de policy routing con failover automatico
          WAN1_GW="{{ wan1_gateway }}"
          WAN2_GW="{{ wan2_gateway }}"
          WAN1_DEV="{{ wan_interface }}"
          WAN2_DEV="{{ wan2_interface }}"

          check_wan() {
            fping -c 2 -t 2000 -I "$1" 8.8.8.8 >/dev/null 2>&1 || \
            fping -c 2 -t 2000 -I "$1" 1.1.1.1 >/dev/null 2>&1
          }

          check_wan "$WAN1_DEV" && WAN1_UP=1 || WAN1_UP=0
          check_wan "$WAN2_DEV" && WAN2_UP=1 || WAN2_UP=0

          # Tabla wan1_primary: WAN1 preferida con failover a WAN2
          if [ $WAN1_UP -eq 1 ]; then
            ip route replace default via $WAN1_GW dev $WAN1_DEV table wan1_primary
            logger -t wan-failover "wan1_primary: activo via WAN1 ($WAN1_GW)"
          elif [ $WAN2_UP -eq 1 ]; then
            ip route replace default via $WAN2_GW dev $WAN2_DEV table wan1_primary
            logger -t wan-failover "wan1_primary: FAILOVER a WAN2 - WAN1 caida"
          else
            logger -t wan-failover "ALERTA: ambas WANs inaccesibles"
          fi

          # Tabla wan2_primary: WAN2 preferida con failover a WAN1
          if [ $WAN2_UP -eq 1 ]; then
            ip route replace default via $WAN2_GW dev $WAN2_DEV table wan2_primary
            logger -t wan-failover "wan2_primary: activo via WAN2 ($WAN2_GW)"
          elif [ $WAN1_UP -eq 1 ]; then
            ip route replace default via $WAN1_GW dev $WAN1_DEV table wan2_primary
            logger -t wan-failover "wan2_primary: FAILOVER a WAN1 - WAN2 caida"
          fi

    - name: Crear servicio systemd para policy routing
      ansible.builtin.copy:
        dest: /etc/systemd/system/policy-routing.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Policy routing por VLAN dual-WAN (WAN1_PRIMARY / WAN2_PRIMARY)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/policy-routing-setup.sh
          ExecStartPost=/usr/local/bin/wan-failover.sh
          RemainAfterExit=true

          [Install]
          WantedBy=multi-user.target

    - name: Crear servicio wan-failover para el timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/wan-failover.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=WAN health check y failover de policy routing

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/wan-failover.sh

    - name: Crear timer systemd para monitoreo WAN cada 30s
      ansible.builtin.copy:
        dest: /etc/systemd/system/wan-failover.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Monitoreo periodico de WANs para failover de policy routing

          [Timer]
          OnBootSec=60
          OnUnitActiveSec=30
          Unit=wan-failover.service

          [Install]
          WantedBy=timers.target

    - name: Habilitar policy routing y failover WAN
      ansible.builtin.systemd:
        name: "{{ item }}"
        daemon_reload: true
        enabled: true
        state: started
      loop:
        - policy-routing.service
        - wan-failover.timer

    # --- VRRP por VLAN ---
    - name: Configurar keepalived con una instancia por VLAN
      ansible.builtin.copy:
        dest: /etc/keepalived/keepalived.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          {% for vlan in vlans %}
          vrrp_instance VLAN{{ vlan.id }}_VIP {
              state {{ vrrp_state }}
              interface {{ trunk_interface }}.{{ vlan.id }}
              virtual_router_id {{ vlan.vrrp_id }}
              priority {{ vrrp_priority }}
              advert_int 1
          {% if vlan.id == 10 %}
              notify /usr/local/bin/conntrackd-notify.sh
          {% endif %}

              authentication {
                  auth_type PASS
                  auth_pass {{ vrrp_auth_pass }}
              }

              virtual_ipaddress {
                  {{ vlan.vip }} dev {{ trunk_interface }}.{{ vlan.id }}
              }
          }

          {% endfor %}
      notify: Restart keepalived

    - name: Iniciar y habilitar keepalived
      ansible.builtin.systemd:
        name: keepalived
        enabled: true
        state: started

    - name: Guardar reglas iptables
      ansible.builtin.shell: netfilter-persistent save
      args:
        executable: /bin/bash
      changed_when: false

    # --- State Sync entre nodos (conntrackd) ---
    - name: Crear script de notificacion conntrackd para keepalived
      ansible.builtin.copy:
        dest: /usr/local/bin/conntrackd-notify.sh
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          # Llamado por keepalived al cambiar estado VRRP de VLAN10
          # $1=GROUP|INSTANCE  $2=nombre_instancia  $3=MASTER|BACKUP|FAULT
          TYPE=$3
          case "$TYPE" in
            MASTER)
              /usr/sbin/conntrackd -c
              /usr/sbin/conntrackd -f
              /usr/sbin/conntrackd -R
              /usr/sbin/conntrackd -B
              ;;
            BACKUP)
              /usr/sbin/conntrackd -n
              ;;
            FAULT)
              /usr/sbin/conntrackd -f
              ;;
          esac
          exit 0

    - name: Escribir configuracion conntrackd
      ansible.builtin.copy:
        dest: /etc/conntrackd/conntrackd.conf
        owner: root
        group: root
        mode: "0640"
        content: |
          Sync {
            Mode FTFW {
              DisableExternalCache Off
              CommitTimeout 1800
              PurgeTimeout 5
            }
            UDP {
              IPv4_address {{ sync_local_ip }}
              IPv4_Destination_Address {{ sync_peer_ip }}
              Port 3780
              Interface {{ trunk_interface }}.10
              SndSocketBuffer 1249280
              RcvSocketBuffer 1249280
              Checksum on
            }
          }
          General {
            Nice -20
            HashSize 32768
            HashLimit 131072
            LogFile /var/log/conntrackd.log
            Syslog on
            LockFile /var/lock/conntrack.lock
            UNIX {
              Path /var/run/conntrackd.ctl
              Backlog 20
            }
            NetlinkBufferSize 262144
            NetlinkBufferSizeMaxGrowth 655360
            Filter From Userspace {
              Protocol Accept {
                TCP
                UDP
                ICMP
              }
              Address Ignore {
                IPv4_address 127.0.0.1
                IPv4_address {{ sync_local_ip }}
              }
            }
          }
      notify: Restart conntrackd

    - name: Habilitar e iniciar conntrackd
      ansible.builtin.systemd:
        name: conntrackd
        enabled: true
        state: started

  handlers:
    - name: Apply netplan
      ansible.builtin.shell: netplan generate && netplan apply
      args:
        executable: /bin/bash


    - name: Restart keepalived
      ansible.builtin.systemd:
        name: keepalived
        state: restarted

    - name: Restart isc-dhcp-relay
      ansible.builtin.systemd:
        name: isc-dhcp-relay
        state: restarted

    - name: Restart conntrackd
      ansible.builtin.systemd:
        name: conntrackd
        state: restarted
