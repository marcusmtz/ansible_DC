---
- name: Fase 2 - Post configuracion con usuario de dominio
  hosts: windows_domain
  gather_facts: false

  vars:
    dhcp_scopes:
      - scope_id: "192.168.20.0"
        name: "VLAN20-Administracion"
        start_range: "192.168.20.50"
        end_range: "192.168.20.120"
        subnet_mask: "255.255.255.128"
        router: "192.168.20.1"
        dns_servers: ["192.168.10.5", "192.168.10.6"]
        lease_days: 1
        lease_hours: 0
        description: "Administracion - VLAN 20 - /25 (126 hosts)"

      - scope_id: "192.168.30.0"
        name: "VLAN30-TI"
        start_range: "192.168.30.30"
        end_range: "192.168.30.60"
        subnet_mask: "255.255.255.192"
        router: "192.168.30.1"
        dns_servers: ["192.168.10.5", "192.168.10.6"]
        lease_days: 1
        lease_hours: 0
        description: "TI - VLAN 30 - /26 (62 hosts)"

      - scope_id: "192.168.40.0"
        name: "VLAN40-Ventas"
        start_range: "192.168.40.50"
        end_range: "192.168.40.120"
        subnet_mask: "255.255.255.128"
        router: "192.168.40.1"
        dns_servers: ["192.168.10.5", "192.168.10.6"]
        lease_days: 1
        lease_hours: 0
        description: "Ventas - VLAN 40 - /25 (126 hosts)"

  tasks:
    - name: Esperar a WinRM
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 5985
        timeout: 900
      delegate_to: localhost
      become: false

    - name: Instalar DHCP
      ansible.windows.win_feature:
        name: DHCP
        state: present
        include_management_tools: true
      register: dhcp_install

    - name: Reiniciar despues de instalar DHCP si es necesario
      ansible.windows.win_reboot:
        reboot_timeout: 1200
        post_reboot_delay: 45
      when: dhcp_install.reboot_required | default(false)

    - name: Autorizar servidor DHCP en Active Directory
      ansible.windows.win_shell: |
        $cs = Get-CimInstance Win32_ComputerSystem
        $fqdn = "$($env:COMPUTERNAME).$($cs.Domain)"
        $ip = "{{ ansible_host }}"

        $existing = Get-DhcpServerInDC -ErrorAction SilentlyContinue | Where-Object {
          $_.DnsName -ieq $fqdn -or $_.IPAddress -eq $ip
        }

        if ($existing) {
          Write-Output "ALREADY_AUTHORIZED"
        }
        else {
          Add-DhcpServerInDC -DnsName $fqdn -IpAddress $ip
          Write-Output "AUTHORIZED"
        }
      register: dhcp_authorize
      changed_when: "'AUTHORIZED' in dhcp_authorize.stdout"

    - name: Completar post-instalacion de seguridad DHCP
      ansible.windows.win_shell: |
        Invoke-DhcpServerPostInstall -ErrorAction SilentlyContinue 2>&1 | Out-Null
        Write-Output "DONE"
      changed_when: false

    - name: Esperar que el servicio DHCP este operativo
      ansible.windows.win_service:
        name: DHCPServer
        state: started

    - name: Crear scope DHCP por VLAN
      ansible.windows.win_shell: |
        $scopeId = "{{ item.scope_id }}"
        $existing = Get-DhcpServerv4Scope -ScopeId $scopeId -ErrorAction SilentlyContinue
        if (-not $existing) {
          Add-DhcpServerv4Scope `
            -Name "{{ item.name }}" `
            -StartRange "{{ item.start_range }}" `
            -EndRange "{{ item.end_range }}" `
            -SubnetMask "{{ item.subnet_mask }}" `
            -Description "{{ item.description }}" `
            -State Active
          Write-Output "CREATED"
        } else {
          Write-Output "EXISTS"
        }
      loop: "{{ dhcp_scopes }}"
      register: dhcp_scope_result
      changed_when: "'CREATED' in dhcp_scope_result.stdout"

    - name: Configurar opciones de scope DHCP (router, DNS y lease)
      ansible.windows.win_shell: |
        $scopeId = "{{ item.scope_id }}"
        $dnsServers = @({{ item.dns_servers | map('regex_replace', '^(.*)$', '"\\1"') | join(', ') }})
        $expectedLease = [TimeSpan]::new({{ item.lease_days }}, {{ item.lease_hours }}, 0, 0)
        $changed = $false

        $currentRouter = (Get-DhcpServerv4OptionValue -ScopeId $scopeId -OptionId 3 -ErrorAction SilentlyContinue).Value
        if (-not $currentRouter -or $currentRouter[0] -ne "{{ item.router }}") {
          Set-DhcpServerv4OptionValue -ScopeId $scopeId -Router "{{ item.router }}" -Force
          $changed = $true
        }

        $currentDns = (Get-DhcpServerv4OptionValue -ScopeId $scopeId -OptionId 6 -ErrorAction SilentlyContinue).Value
        if (-not $currentDns -or (Compare-Object $currentDns $dnsServers)) {
          Set-DhcpServerv4OptionValue -ScopeId $scopeId -OptionId 6 -Value $dnsServers -Force
          $changed = $true
        }

        $currentLease = (Get-DhcpServerv4Scope -ScopeId $scopeId).LeaseDuration
        if ($currentLease -ne $expectedLease) {
          Set-DhcpServerv4Scope -ScopeId $scopeId -LeaseDuration $expectedLease
          $changed = $true
        }

        if ($changed) { Write-Output "CONFIGURED" } else { Write-Output "EXISTS" }
      loop: "{{ dhcp_scopes }}"
      register: dhcp_opts_result
      changed_when: "'CONFIGURED' in dhcp_opts_result.stdout"

    - name: Permitir transferencia de zona al DNS secundario
      ansible.windows.win_shell: |
        $zone = Get-DnsServerPrimaryZone -Name "norcom.internal" -ErrorAction SilentlyContinue
        if ($zone.SecureSecondaries -eq "TransferToSecureServers" -and $zone.SecondaryServers -contains "192.168.10.6") {
          Write-Output "EXISTS"
        } else {
          Set-DnsServerPrimaryZone -Name "norcom.internal" -SecureSecondaries TransferToSecureServers -SecondaryServers 192.168.10.6
          Write-Output "CHANGED"
        }
      register: zone_xfer
      changed_when: "'CHANGED' in zone_xfer.stdout"

    - name: Configurar notify DNS para secundarios
      ansible.windows.win_shell: |
        $zone = Get-DnsServerPrimaryZone -Name "norcom.internal" -ErrorAction SilentlyContinue
        if ($zone.Notify -eq "Notify") {
          Write-Output "EXISTS"
        } else {
          Set-DnsServerPrimaryZone -Name "norcom.internal" -Notify Notify
          Write-Output "CHANGED"
        }
      register: zone_notify
      changed_when: "'CHANGED' in zone_notify.stdout"

    - name: Validar identidad actual
      ansible.windows.win_shell: whoami
      register: whoami_out
      changed_when: false

    - name: Mostrar identidad
      ansible.builtin.debug:
        var: whoami_out.stdout
