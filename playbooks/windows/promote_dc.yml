---
- name: Fase 1 - Promocion con usuario local
  hosts: windows_local
  gather_facts: false

  vars:
    domain_name: norcom.internal
    netbios_name: NORCOM

  tasks:
    - name: Validar password para modo restauracion (DSRM)
      ansible.builtin.assert:
        that:
          - dsrm_password | length >= 8
          - dsrm_password is search('[A-Z]')
          - dsrm_password is search('[a-z]')
          - dsrm_password is search('[0-9]')
          - dsrm_password is search('[^A-Za-z0-9]')
        fail_msg: "dsrm_password debe tener minimo 8 caracteres, mayusculas, minusculas, numeros y un caracter especial."

    - name: Instalar AD DS y DNS
      ansible.windows.win_feature:
        name:
          - AD-Domain-Services
          - DNS
        state: present
        include_management_tools: true

    - name: Habilitar escritorio remoto (RDP)
      ansible.windows.win_regedit:
        path: HKLM:\System\CurrentControlSet\Control\Terminal Server
        name: fDenyTSConnections
        data: 0
        type: dword

    - name: Habilitar reglas de firewall para RDP
      ansible.windows.win_shell: Enable-NetFirewallRule -Name "RemoteDesktop*"
      changed_when: true

    - name: Crear nuevo bosque con DNS integrado
      microsoft.ad.domain:
        dns_domain_name: "{{ domain_name }}"
        domain_netbios_name: "{{ netbios_name }}"
        safe_mode_password: "{{ dsrm_password }}"
      register: domain_create

    - name: Reiniciar si es necesario
      ansible.windows.win_reboot:
        reboot_timeout: 1800
        post_reboot_delay: 60
      when: domain_create.reboot_required | default(false)
