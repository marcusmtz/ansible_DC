---
- name: Crear registro DNS en el DC Windows para el servidor Zabbix
  hosts: windows_domain
  gather_facts: false

  vars:
    dns_zone: "norcom.internal"
    zabbix_name: "zabbix"
    zabbix_ip: "192.168.10.10"

  tasks:

    - name: Crear registro A para zabbix.norcom.internal
      ansible.windows.win_shell: |
        $existing = Get-DnsServerResourceRecord `
          -ZoneName "{{ dns_zone }}" `
          -Name "{{ zabbix_name }}" `
          -RRType A `
          -ErrorAction SilentlyContinue | Where-Object {
            $_.RecordData.IPv4Address.ToString() -eq "{{ zabbix_ip }}"
          }

        if ($existing) {
          Write-Output "EXISTS"
        } else {
          Add-DnsServerResourceRecordA `
            -ZoneName "{{ dns_zone }}" `
            -Name "{{ zabbix_name }}" `
            -IPv4Address "{{ zabbix_ip }}" `
            -TimeToLive "00:05:00"
          Write-Output "CREATED"
        }
      register: dns_a_result
      changed_when: "'CREATED' in dns_a_result.stdout"

    - name: Verificar registro creado
      ansible.windows.win_shell: |
        Get-DnsServerResourceRecord -ZoneName "{{ dns_zone }}" -Name "{{ zabbix_name }}" -RRType A |
          Format-List HostName, RecordType, RecordData
      register: dns_verify
      changed_when: false

    - name: Mostrar registro DNS
      ansible.builtin.debug:
        var: dns_verify.stdout_lines
