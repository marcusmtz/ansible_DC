---
# ==============================================================================
# Play 1: Instalar Zabbix Agent2 en servidores Linux (Ubuntu)
# ==============================================================================
- name: Instalar Zabbix Agent2 en servidores Linux
  hosts:
    - ubuntu_dns_secondary
    - ubuntu_file_server
    - ubuntu_mail
    - ubuntu_routers
  become: true
  gather_facts: true

  vars:
    zabbix_version: "7.0"
    zabbix_server_ip: "192.168.10.10"

  tasks:

    # =========================================================================
    # REPOSITORIO Y PAQUETE
    # =========================================================================
    - name: Descargar paquete de repositorio Zabbix {{ zabbix_version }}
      ansible.builtin.get_url:
        url: "https://repo.zabbix.com/zabbix/{{ zabbix_version }}/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_{{ zabbix_version }}+ubuntu24.04_all.deb"
        dest: /tmp/zabbix-release.deb
        mode: '0644'
        force: false

    - name: Instalar repositorio de Zabbix
      ansible.builtin.apt:
        deb: /tmp/zabbix-release.deb

    - name: Actualizar cache apt tras agregar repositorio
      ansible.builtin.apt:
        update_cache: true

    - name: Instalar zabbix-agent2
      ansible.builtin.apt:
        name: zabbix-agent2
        state: present

    # =========================================================================
    # CONFIGURACION
    # =========================================================================
    - name: Configurar servidor Zabbix en zabbix_agent2.conf
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^Server='
        line: "Server={{ zabbix_server_ip }}"
        state: present
        backup: true
      notify: Restart zabbix-agent2

    - name: Configurar ServerActive en zabbix_agent2.conf
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^ServerActive='
        line: "ServerActive={{ zabbix_server_ip }}"
        state: present
      notify: Restart zabbix-agent2

    - name: Configurar Hostname en zabbix_agent2.conf
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^Hostname='
        line: "Hostname={{ inventory_hostname }}"
        state: present
      notify: Restart zabbix-agent2

    # =========================================================================
    # FIREWALL UFW (solo en servidores, no en routers que usan iptables)
    # =========================================================================
    - name: Permitir puerto Zabbix Agent en UFW
      community.general.ufw:
        rule: allow
        port: '10050'
        proto: tcp
        src: "{{ zabbix_server_ip }}"
      when: inventory_hostname not in groups['ubuntu_routers']

    # =========================================================================
    # SERVICIO
    # =========================================================================
    - name: Habilitar y arrancar zabbix-agent2
      ansible.builtin.systemd:
        name: zabbix-agent2
        enabled: true
        state: started

  handlers:
    - name: Restart zabbix-agent2
      ansible.builtin.systemd:
        name: zabbix-agent2
        state: restarted

# ==============================================================================
# Play 2: Instalar Zabbix Agent (6.0 LTS) en VoIP - Sangoma Linux 7 (RHEL 7)
# Zabbix 7.0 no soporta RHEL 7 — se usa agente 6.0 LTS (compatible con server 7.0)
# ==============================================================================
- name: Instalar Zabbix Agent en VoIP Sangoma Linux 7
  hosts: voip
  become: true
  gather_facts: false

  vars:
    zabbix_server_ip: "192.168.10.10"

  tasks:

    # =========================================================================
    # PYTHON (necesario para que Ansible funcione en RHEL 7)
    # =========================================================================
    - name: Instalar Python 3 via raw (no requiere Python previo)
      ansible.builtin.raw: yum install -y python3
      changed_when: true

    # =========================================================================
    # REPOSITORIO Y PAQUETE
    # =========================================================================
    - name: Instalar repositorio Zabbix 6.0 para RHEL 7
      ansible.builtin.yum:
        name: "https://repo.zabbix.com/zabbix/6.0/rhel/7/x86_64/zabbix-release-6.0-4.el7.noarch.rpm"
        state: present
        disable_gpg_check: true

    - name: Instalar zabbix-agent2
      ansible.builtin.yum:
        name: zabbix-agent2
        state: present

    # =========================================================================
    # CONFIGURACION
    # =========================================================================
    - name: Configurar Server en zabbix_agent2.conf
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^Server='
        line: "Server={{ zabbix_server_ip }}"
        state: present
        backup: true
      notify: Restart zabbix-agent2

    - name: Configurar ServerActive en zabbix_agent2.conf
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^ServerActive='
        line: "ServerActive={{ zabbix_server_ip }}"
        state: present
      notify: Restart zabbix-agent2

    - name: Configurar Hostname en zabbix_agent2.conf
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^Hostname='
        line: "Hostname={{ inventory_hostname }}"
        state: present
      notify: Restart zabbix-agent2

    # =========================================================================
    # FIREWALL FIREWALLD
    # =========================================================================
    - name: Abrir puerto 10050 en firewalld
      ansible.posix.firewalld:
        port: 10050/tcp
        permanent: true
        state: enabled
        immediate: true

    # =========================================================================
    # SERVICIO
    # =========================================================================
    - name: Habilitar y arrancar zabbix-agent2
      ansible.builtin.systemd:
        name: zabbix-agent2
        enabled: true
        state: started

  handlers:
    - name: Restart zabbix-agent2
      ansible.builtin.systemd:
        name: zabbix-agent2
        state: restarted

# ==============================================================================
# Play 3: Instalar Zabbix Agent2 en Windows Server (DC)
# ==============================================================================
- name: Instalar Zabbix Agent2 en Windows DC
  hosts: windows_domain
  gather_facts: false

  vars:
    zabbix_version: "7.0.13"
    zabbix_server_ip: "192.168.10.10"
    zabbix_agent_msi: "C:\\Temp\\zabbix_agent2.msi"

  tasks:

    # =========================================================================
    # DESCARGA E INSTALACION
    # =========================================================================
    - name: Crear directorio temporal
      ansible.windows.win_file:
        path: C:\Temp
        state: directory

    - name: Descargar instalador MSI de Zabbix Agent2
      ansible.windows.win_get_url:
        url: "https://cdn.zabbix.com/zabbix/binaries/stable/7.0/{{ zabbix_version }}/zabbix_agent2-{{ zabbix_version }}-windows-amd64-openssl.msi"
        dest: "{{ zabbix_agent_msi }}"
        force: false

    - name: Instalar Zabbix Agent2 via MSI
      ansible.windows.win_package:
        path: "{{ zabbix_agent_msi }}"
        state: present
        arguments: "/quiet /norestart SERVER={{ zabbix_server_ip }} SERVERACTIVE={{ zabbix_server_ip }} HOSTNAME={{ inventory_hostname }}"

    # =========================================================================
    # FIREWALL WINDOWS
    # =========================================================================
    - name: Abrir puerto 10050 en firewall de Windows
      community.windows.win_firewall_rule:
        name: "Zabbix Agent2"
        localport: 10050
        action: allow
        direction: in
        protocol: tcp
        state: present
        enabled: true

    # =========================================================================
    # SERVICIO
    # =========================================================================
    - name: Habilitar y arrancar servicio Zabbix Agent2
      ansible.windows.win_service:
        name: "Zabbix Agent 2"
        start_mode: auto
        state: started
