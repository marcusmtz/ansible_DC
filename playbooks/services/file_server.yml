---
- name: Configurar Ubuntu como file server (Samba + Active Directory)
  hosts: ubuntu_file_server
  become: true

  vars:
    smb_shares:
      - name: CompartidoAdmin
        path: /srv/samba/admin
        group: Administracion
      - name: CompartidoTI
        path: /srv/samba/ti
        group: TI
      - name: CompartidoVentas
        path: /srv/samba/ventas
        group: Ventas
      - name: CompartidoAdminAqp
        path: /srv/samba/admin_aqp
        group: Administracion Arequipa
      - name: CompartidoVentasAqp
        path: /srv/samba/ventas_aqp
        group: Ventas Arequipa
      - name: CompartidoContabilidadAqp
        path: /srv/samba/contabilidad_aqp
        group: Contabilidad Arequipa
    domain: norcom.internal
    domain_upper: NORCOM
    domain_admin: Administrador

  tasks:
    - name: Instalar paquetes necesarios
      ansible.builtin.apt:
        name:
          - samba
          - krb5-user
          - realmd
          - adcli
          - sssd
          - sssd-tools
        state: present
        update_cache: true

    - name: Unir al dominio Active Directory
      ansible.builtin.shell: |
        if realm list | grep -q "{{ domain }}"; then
          echo "ALREADY_JOINED"
        else
          echo "{{ domain_admin_password }}" | realm join --user={{ domain_admin }} {{ domain }}
          echo "JOINED"
        fi
      args:
        executable: /bin/bash
      register: realm_join
      changed_when: "'JOINED' in realm_join.stdout"

    - name: Configurar nsswitch passwd con sss
      ansible.builtin.lineinfile:
        path: /etc/nsswitch.conf
        regexp: '^passwd:'
        line: 'passwd:         files sss'

    - name: Configurar nsswitch group con sss
      ansible.builtin.lineinfile:
        path: /etc/nsswitch.conf
        regexp: '^group:'
        line: 'group:          files sss'

    - name: Reiniciar SSSD para aplicar configuracion del dominio
      ansible.builtin.systemd:
        name: sssd
        state: restarted
        enabled: true

    - name: Limpiar cache de SSSD para forzar lectura del AD
      ansible.builtin.command: sss_cache -E
      changed_when: false

    - name: Crear carpetas de recursos compartidos
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: "{{ item.group }}@{{ domain }}"
        mode: "0770"
      loop: "{{ smb_shares }}"

    - name: Configurar Samba para Active Directory con SSSD
      ansible.builtin.copy:
        dest: /etc/samba/smb.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [global]
              workgroup = {{ domain_upper }}
              realm = {{ domain | upper }}
              security = ADS

              idmap config * : backend = tdb
              idmap config * : range = 10000-99999

              template shell = /bin/bash
              template homedir = /home/%U

              server min protocol = SMB2
              server max protocol = SMB3

          {% for share in smb_shares %}
          [{{ share.name }}]
              path = {{ share.path }}
              browseable = yes
              read only = no
              guest ok = no
              valid users = @"{{ share.group }}@{{ domain }}"
              create mask = 0660
              directory mask = 0770

          {% endfor %}
      notify: Restart samba

    - name: Validar configuracion de Samba
      ansible.builtin.command: testparm -s
      register: samba_config_test
      changed_when: false

    - name: Habilitar y arrancar smbd
      ansible.builtin.service:
        name: smbd
        enabled: true
        state: started

    - name: Permitir Samba en UFW si esta activo
      ansible.builtin.command: ufw allow Samba
      register: ufw_samba
      changed_when: "'Rule added' in ufw_samba.stdout or 'updated' in ufw_samba.stdout"
      failed_when: false

  handlers:
    - name: Restart samba
      ansible.builtin.service:
        name: smbd
        state: restarted
