---
- name: Configurar Ubuntu como file server (Samba + Active Directory)
  hosts: ubuntu_file_server
  become: true

  vars:
    smb_shares:
      - name: CompartidoAdmin
        path: /srv/samba/admin
        group: Administracion
      - name: CompartidoTI
        path: /srv/samba/ti
        group: TI
      - name: CompartidoVentas
        path: /srv/samba/ventas
        group: Ventas
      - name: CompartidoAdminAqp
        path: /srv/samba/admin_aqp
        group: Administracion Arequipa
      - name: CompartidoVentasAqp
        path: /srv/samba/ventas_aqp
        group: Ventas Arequipa
      - name: CompartidoContabilidadAqp
        path: /srv/samba/contabilidad_aqp
        group: Contabilidad Arequipa
    domain: norcom.internal
    domain_upper: NORCOM
    domain_admin: Administrador

  tasks:
    - name: Instalar paquetes necesarios
      ansible.builtin.apt:
        name:
          - samba
          - winbind
          - krb5-user
          - realmd
          - adcli
          - sssd
          - sssd-tools
        state: present
        update_cache: true

    - name: Unir al dominio Active Directory
      ansible.builtin.shell: |
        if realm list | grep -q "{{ domain }}"; then
          echo "ALREADY_JOINED"
        else
          echo "{{ domain_admin_password }}" | realm join --user={{ domain_admin }} {{ domain }}
          echo "JOINED"
        fi
      args:
        executable: /bin/bash
      register: realm_join
      changed_when: "'JOINED' in realm_join.stdout"

    - name: Unir Samba al AD (cuenta de maquina)
      ansible.builtin.shell: |
        if ! net ads testjoin 2>/dev/null; then
          echo "{{ domain_admin_password }}" | net ads join -U {{ domain_admin }}
          echo "SAMBACREATED"
        else
          echo "SAMBAOK"
        fi
      args:
        executable: /bin/bash
      register: samba_join
      changed_when: "'SAMBACREATED' in samba_join.stdout"

    - name: Crear smb.conf temporal para keytab
      ansible.builtin.copy:
        dest: /etc/samba/smb.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [global]
              workgroup = {{ domain_upper }}
              realm = {{ domain | upper }}
              security = ADS
              kerberos method = secrets and keytab

    - name: Regenerar keytab de Kerberos
      ansible.builtin.shell: |
        net ads keytab create -U {{ domain_admin }}%{{ domain_admin_password }}
      args:
        executable: /bin/bash
      register: keytab_create
      changed_when: "'Success' in keytab_create.stdout or keytab_create.rc == 0"

    - name: Verificar keytab funciona
      ansible.builtin.shell: |
        hostname_upper=$(hostname | tr '[:lower:]' '[:upper:]')
        klist -k /etc/krb5.keytab | grep -qi "$hostname_upper"
      args:
        executable: /bin/bash
      register: keytab_check
      changed_when: false

    - name: Configurar nsswitch passwd con sss
      ansible.builtin.lineinfile:
        path: /etc/nsswitch.conf
        regexp: '^passwd:'
        line: 'passwd:         files sss'

    - name: Configurar nsswitch group con sss
      ansible.builtin.lineinfile:
        path: /etc/nsswitch.conf
        regexp: '^group:'
        line: 'group:          files sss'

    - name: Configurar nsswitch con winbind
      ansible.builtin.lineinfile:
        path: /etc/nsswitch.conf
        regexp: '^passwd:.*winbind'
        line: 'passwd:         files sss winbind'
      failed_when: false

    - name: Reiniciar SSSD para aplicar configuracion del dominio
      ansible.builtin.systemd:
        name: sssd
        state: restarted
        enabled: true
      failed_when: false

    - name: Limpiar cache de SSSD para forzar lectura del AD
      ansible.builtin.command: sss_cache -E
      changed_when: false
      failed_when: false

    - name: Verificar estado de SSSD
      ansible.builtin.shell: |
        for i in 1 2 3; do
          if systemctl is-active --quiet sssd; then
            echo "SSSD_OK"
            exit 0
          fi
          systemctl restart sssd || true
          sleep 2
        done
        echo "SSSD_FAILED"
      args:
        executable: /bin/bash
      register: sssd_status
      changed_when: false

    - name: Habilitar e iniciar winbind
      ansible.builtin.systemd:
        name: winbind
        enabled: true
        state: started

    - name: Verificar winbind corriendo con reintentos
      ansible.builtin.shell: |
        for i in 1 2 3; do
          if systemctl is-active --quiet winbind; then
            echo "WINBIND_OK"
            exit 0
          fi
          systemctl restart winbind || true
          sleep 2
        done
        echo "WINBIND_FAILED"
      args:
        executable: /bin/bash
      register: winbind_status
      changed_when: false

    - name: Crear carpetas de recursos compartidos
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: "{{ item.group }}@{{ domain }}"
        mode: "0770"
      loop: "{{ smb_shares }}"

    - name: Configurar Samba para Active Directory con winbind
      ansible.builtin.copy:
        dest: /etc/samba/smb.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [global]
              workgroup = {{ domain_upper }}
              realm = {{ domain | upper }}
              security = ADS

              idmap config * : backend = tdb
              idmap config * : range = 10000-99999

              winbind use default domain = yes
              winbind offline logon = false
              winbind enum users = yes
              winbind enum groups = yes

              template shell = /bin/bash
              template homedir = /home/%U

              server min protocol = SMB2
              server max protocol = SMB3

          {% for share in smb_shares %}
          [{{ share.name }}]
              path = {{ share.path }}
              browseable = yes
              read only = no
              guest ok = no
              valid users = +"{{ share.group }}"
              create mask = 0660
              directory mask = 0770

          {% endfor %}

    - name: Validar configuracion de Samba
      ansible.builtin.command: testparm -s
      register: samba_config_test
      changed_when: false

    - name: Reiniciar smbd si cambio configuracion
      ansible.builtin.systemd:
        name: smbd
        state: restarted
        enabled: true

    - name: Verificar smbd activo
      ansible.builtin.shell: |
        for i in 1 2 3; do
          if systemctl is-active --quiet smbd; then
            echo "SMB_OK"
            exit 0
          fi
          systemctl restart smbd || true
          sleep 2
        done
        echo "SMB_FAILED"
      args:
        executable: /bin/bash
      register: smbd_status
      changed_when: false

    - name: Reiniciar winbind si cambio configuracion
      ansible.builtin.systemd:
        name: winbind
        state: restarted
        enabled: true

    - name: Verificar winbind post-reinicio
      ansible.builtin.shell: |
        for i in 1 2 3; do
          if systemctl is-active --quiet winbind; then
            echo "WINBIND_OK"
            exit 0
          fi
          systemctl restart winbind || true
          sleep 2
        done
        journalctl -xeu winbind.service --no-pager -l | tail -15
        echo "WINBIND_FAILED"
      args:
        executable: /bin/bash
      register: winbind_final
      changed_when: false

    - name: Verificar estado final del join
      ansible.builtin.shell: |
        echo "=== realm list ==="
        realm list
        echo "=== net ads testjoin ==="
        net ads testjoin
        echo "=== smbd ==="
        systemctl is-active smbd
        echo "=== winbind ==="
        systemctl is-active winbind
      args:
        executable: /bin/bash
      register: final_status
      changed_when: false

    - name: Mostrar resumen
      ansible.builtin.debug:
        msg:
          - "SSSD: {{ sssd_status.stdout }}"
          - "Winbind inicial: {{ winbind_status.stdout }}"
          - "Samba config: {{ samba_config_test.stdout_lines | last }}"
          - "Winbind final: {{ winbind_final.stdout }}"
          - "Estado final: {{ final_status.stdout }}"

    - name: Permitir Samba en UFW si esta activo
      ansible.builtin.command: ufw allow Samba
      register: ufw_samba
      changed_when: "'Rule added' in ufw_samba.stdout or 'updated' in ufw_samba.stdout"
      failed_when: false
