---
- name: Post-configuracion de servidor Zabbix en AlmaLinux
  hosts: zabbix_server
  become: true

  vars:
    # === Configuracion de Red ===
    network_interface: "eth0"
    static_ip: "192.168.10.10"
    netmask: "255.255.255.192"  # /26 VLSM
    prefix: 26
    gateway: "192.168.10.1"
    dns_servers:
      - "192.168.10.5"
      - "192.168.10.6"
    dns_search: "norcom.internal"

    # === Seguridad ===
    root_password: "Zabbix_Root_2024!"  # Cambiar por una contraseña segura

    # === Zona Horaria ===
    system_timezone: "America/Lima"

    # === Configuracion PHP ===
    php_ini_path: "/etc/php.ini"
    php_fpm_zabbix_conf: "/etc/php-fpm.d/zabbix.conf"

    # === Servicios ===
    web_server: "httpd"  # Puede ser 'httpd' o 'nginx'
    php_fpm_service: "php-fpm"

  tasks:
    # ========================================================================
    # TAREA 1: CONFIGURAR IP ESTATICA
    # ========================================================================
    - name: Instalar NetworkManager si no esta presente
      ansible.builtin.dnf:
        name: NetworkManager
        state: present

    - name: Asegurar que NetworkManager esta habilitado y corriendo
      ansible.builtin.systemd:
        name: NetworkManager
        enabled: true
        state: started

    - name: Configurar IP estatica en la interfaz {{ network_interface }}
      community.general.nmcli:
        conn_name: "{{ network_interface }}"
        ifname: "{{ network_interface }}"
        type: ethernet
        ip4: "{{ static_ip }}/{{ prefix }}"
        gw4: "{{ gateway }}"
        dns4: "{{ dns_servers }}"
        dns4_search: "{{ dns_search }}"
        state: present
        autoconnect: true
      notify: Restart NetworkManager

    - name: Activar la conexion de red
      community.general.nmcli:
        conn_name: "{{ network_interface }}"
        state: up

    # ========================================================================
    # TAREA 2: CAMBIAR CONTRASENA DE ROOT
    # ========================================================================
    - name: Cambiar contrasena del usuario root
      ansible.builtin.user:
        name: root
        password: "{{ root_password | password_hash('sha512') }}"
        update_password: always
      no_log: true  # Ocultar la contraseña en los logs

    - name: Validar que la contrasena de root fue cambiada
      ansible.builtin.debug:
        msg: "Contraseña de root actualizada correctamente"

    # ========================================================================
    # TAREA 3: AJUSTAR ZONA HORARIA (SISTEMA Y PHP)
    # ========================================================================

    # --- Sistema ---
    - name: Configurar zona horaria del sistema
      community.general.timezone:
        name: "{{ system_timezone }}"
      notify:
        - Restart chronyd

    - name: Verificar zona horaria actual del sistema
      ansible.builtin.command: timedatectl
      register: timedatectl_output
      changed_when: false

    - name: Mostrar zona horaria configurada
      ansible.builtin.debug:
        msg: "{{ timedatectl_output.stdout_lines | select('search', 'Time zone') | list }}"

    # --- PHP Global (php.ini) ---
    - name: Verificar si existe el archivo php.ini
      ansible.builtin.stat:
        path: "{{ php_ini_path }}"
      register: php_ini_stat

    - name: Configurar date.timezone en php.ini
      ansible.builtin.lineinfile:
        path: "{{ php_ini_path }}"
        regexp: '^;?\s*date\.timezone\s*='
        line: "date.timezone = {{ system_timezone }}"
        state: present
        backup: true
      when: php_ini_stat.stat.exists
      notify:
        - Restart php-fpm
        - Restart web server

    # --- PHP Zabbix Especifico (php-fpm.d/zabbix.conf) ---
    - name: Verificar si existe el archivo php-fpm zabbix.conf
      ansible.builtin.stat:
        path: "{{ php_fpm_zabbix_conf }}"
      register: php_fpm_zabbix_stat

    - name: Configurar date.timezone en php-fpm zabbix.conf
      ansible.builtin.lineinfile:
        path: "{{ php_fpm_zabbix_conf }}"
        regexp: '^;?\s*php_value\[date\.timezone\]'
        line: "php_value[date.timezone] = {{ system_timezone }}"
        state: present
        backup: true
        insertafter: '^\[zabbix\]'
      when: php_fpm_zabbix_stat.stat.exists
      notify:
        - Restart php-fpm
        - Restart web server

    # ========================================================================
    # TAREA 4: SEGURIDAD WEB - CAMBIAR CONTRASENA ADMIN DE ZABBIX
    # ========================================================================
    - name: Instrucciones para cambiar la contrasena del usuario Admin de Zabbix
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "IMPORTANTE: Cambiar contraseña del usuario 'Admin' de Zabbix"
          - "=========================================================="
          - ""
          - "Metodo 1 - Desde la interfaz web:"
          - "  1. Acceder a http://{{ static_ip }}/zabbix"
          - "  2. Usuario: Admin, Password: zabbix (por defecto)"
          - "  3. Ir a: Administration → Users → Admin"
          - "  4. Cambiar password en la pestaña 'User'"
          - ""
          - "Metodo 2 - Desde la base de datos (script incluido):"
          - "  Ejecutar: /tmp/zabbix_change_admin_password.sh"
          - ""
          - "=========================================================="

    - name: Crear script para cambiar contrasena de Admin en la BD
      ansible.builtin.copy:
        dest: /tmp/zabbix_change_admin_password.sh
        mode: '0700'
        owner: root
        group: root
        content: |
          #!/bin/bash
          # Script para cambiar la contraseña del usuario Admin de Zabbix
          
          # Colores para output
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          NC='\033[0m' # No Color
          
          echo -e "${YELLOW}=========================================${NC}"
          echo -e "${YELLOW}Cambiar Contraseña Admin de Zabbix${NC}"
          echo -e "${YELLOW}=========================================${NC}"
          echo ""
          
          # Solicitar nueva contraseña
          read -sp "Ingrese nueva contraseña para Admin: " NEW_PASSWORD
          echo ""
          read -sp "Confirme la contraseña: " NEW_PASSWORD_CONFIRM
          echo ""
          
          if [ "$NEW_PASSWORD" != "$NEW_PASSWORD_CONFIRM" ]; then
              echo -e "${RED}Error: Las contraseñas no coinciden${NC}"
              exit 1
          fi
          
          if [ ${#NEW_PASSWORD} -lt 8 ]; then
              echo -e "${RED}Error: La contraseña debe tener al menos 8 caracteres${NC}"
              exit 1
          fi
          
          # Generar hash MD5 de la contraseña (Zabbix 5.x y anteriores usan MD5)
          PASSWORD_HASH=$(echo -n "$NEW_PASSWORD" | md5sum | awk '{print $1}')
          
          # Conectar a la base de datos y actualizar
          # NOTA: Ajustar credenciales de MySQL/PostgreSQL según tu instalación
          echo -e "${YELLOW}Actualizando contraseña en la base de datos...${NC}"
          
          # Para MySQL/MariaDB:
          mysql -u zabbix -p zabbix <<EOF
          UPDATE users SET passwd=MD5('$NEW_PASSWORD') WHERE username='Admin';
          SELECT username, CONCAT('Passwd Hash: ', passwd) FROM users WHERE username='Admin';
          EOF
          
          # Para PostgreSQL (descomentar si usas PostgreSQL):
          # psql -U zabbix -d zabbix <<EOF
          # UPDATE users SET passwd=MD5('$NEW_PASSWORD') WHERE username='Admin';
          # SELECT username, 'Passwd Hash: ' || passwd FROM users WHERE username='Admin';
          # EOF
          
          if [ $? -eq 0 ]; then
              echo -e "${GREEN}Contraseña actualizada correctamente${NC}"
              echo -e "${YELLOW}Recuerda: Usuario=Admin, Nueva contraseña=${NC}"
          else
              echo -e "${RED}Error al actualizar la contraseña${NC}"
              exit 1
          fi

    - name: Recordatorio de configuracion de firewall
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "CONFIGURACION DE FIREWALL"
          - "=========================================================="
          - ""
          - "Para permitir acceso a Zabbix, ejecuta:"
          - "  firewall-cmd --permanent --add-service=http"
          - "  firewall-cmd --permanent --add-service=https"
          - "  firewall-cmd --permanent --add-port=10050/tcp  # Zabbix Agent"
          - "  firewall-cmd --permanent --add-port=10051/tcp  # Zabbix Server"
          - "  firewall-cmd --reload"
          - ""
          - "=========================================================="

  # ==========================================================================
  # HANDLERS
  # ==========================================================================
  handlers:
    - name: Restart NetworkManager
      ansible.builtin.systemd:
        name: NetworkManager
        state: restarted

    - name: Restart php-fpm
      ansible.builtin.systemd:
        name: "{{ php_fpm_service }}"
        state: restarted

    - name: Restart web server
      ansible.builtin.systemd:
        name: "{{ web_server }}"
        state: restarted

    - name: Restart chronyd
      ansible.builtin.systemd:
        name: chronyd
        state: restarted
