---
- name: Configurar Ubuntu Router BACKUP con balanceo ECMP, VRRP y VLANs
  hosts: ubuntu_router_backup
  become: true

  vars:
    wan_interface: ens34
    wan1_address: "172.17.25.42/24"
    wan1_gateway: "172.17.25.121"
    wan2_interface: ens35
    wan2_address: "168.17.25.3/29"
    wan2_gateway: "168.17.25.1"

    # Trunk LAN - sin IP propia
    trunk_interface: ens36

    # VLANs
    vlans:
      - id: 10
        name: servidores
        address: "192.168.10.3/24"
        vip: "192.168.10.1/24"
        vrrp_id: 10
      - id: 20
        name: trabajadores
        address: "192.168.20.3/24"
        vip: "192.168.20.1/24"
        vrrp_id: 20
      - id: 30
        name: invitados
        address: "192.168.30.3/24"
        vip: "192.168.30.1/24"
        vrrp_id: 30

    dhcp_server: "192.168.10.5"

    vrrp_state: BACKUP
    vrrp_priority: 100
    vrrp_auth_pass: VRRP_PASS_2024
    netplan_file: /etc/netplan/00-installer-config.yaml
    nameservers:
      - "8.8.8.8"
      - "1.1.1.1"
      - "192.168.13.96"
      - "192.168.13.97"

  tasks:
    - name: Instalar paquetes necesarios
      ansible.builtin.apt:
        name:
          - iptables
          - iptables-persistent
          - netfilter-persistent
          - keepalived
          - vlan
          - isc-dhcp-relay
        state: present
        update_cache: true

    - name: Cargar modulo 8021q para VLANs
      community.general.modprobe:
        name: 8021q
        state: present

    - name: Persistir modulo 8021q
      ansible.builtin.lineinfile:
        path: /etc/modules
        line: 8021q
        state: present

    - name: Escribir netplan con trunk y subinterfaces VLAN
      ansible.builtin.copy:
        dest: "{{ netplan_file }}"
        owner: root
        group: root
        mode: "0600"
        backup: true
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              {{ wan_interface }}:
                dhcp4: false
                addresses: [{{ wan1_address }}]
                nameservers:
                  addresses: {{ nameservers | to_json }}
              {{ wan2_interface }}:
                dhcp4: false
                addresses: [{{ wan2_address }}]
              {{ trunk_interface }}:
                dhcp4: false
            vlans:
          {% for vlan in vlans %}
              {{ trunk_interface }}.{{ vlan.id }}:
                id: {{ vlan.id }}
                link: {{ trunk_interface }}
                dhcp4: false
                addresses: [{{ vlan.address }}]
          {% endfor %}
      notify: Apply netplan

    - name: Forzar aplicacion de netplan antes de continuar
      ansible.builtin.meta: flush_handlers

    - name: Activar IPv4 forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        reload: true

    # --- NAT hacia WAN ---
    - name: NAT MASQUERADE WAN1
      ansible.builtin.shell: |
        if iptables -t nat -C POSTROUTING -o {{ wan_interface }} -j MASQUERADE 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -t nat -A POSTROUTING -o {{ wan_interface }} -j MASQUERADE
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: nat_wan1
      changed_when: "'ADDED' in nat_wan1.stdout"

    - name: NAT MASQUERADE WAN2
      ansible.builtin.shell: |
        if iptables -t nat -C POSTROUTING -o {{ wan2_interface }} -j MASQUERADE 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -t nat -A POSTROUTING -o {{ wan2_interface }} -j MASQUERADE
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: nat_wan2
      changed_when: "'ADDED' in nat_wan2.stdout"

    # --- FORWARD VLANs hacia WAN ---
    - name: Permitir forwarding VLAN hacia WAN
      ansible.builtin.shell: |
        changed=0
        if ! iptables -C FORWARD -i {{ trunk_interface }}.{{ item.id }} -o {{ wan_interface }} -j ACCEPT 2>/dev/null; then
          iptables -A FORWARD -i {{ trunk_interface }}.{{ item.id }} -o {{ wan_interface }} -j ACCEPT
          changed=1
        fi
        if ! iptables -C FORWARD -i {{ trunk_interface }}.{{ item.id }} -o {{ wan2_interface }} -j ACCEPT 2>/dev/null; then
          iptables -A FORWARD -i {{ trunk_interface }}.{{ item.id }} -o {{ wan2_interface }} -j ACCEPT
          changed=1
        fi
        [ $changed -eq 1 ] && echo "ADDED" || echo "EXISTS"
      loop: "{{ vlans }}"
      args:
        executable: /bin/bash
      register: fwd_vlan_wan
      changed_when: "'ADDED' in fwd_vlan_wan.stdout"

    - name: Permitir trafico de retorno WAN hacia VLANs
      ansible.builtin.shell: |
        changed=0
        if ! iptables -C FORWARD -i {{ wan_interface }} -o {{ trunk_interface }}.{{ item.id }} -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null; then
          iptables -A FORWARD -i {{ wan_interface }} -o {{ trunk_interface }}.{{ item.id }} -m state --state RELATED,ESTABLISHED -j ACCEPT
          changed=1
        fi
        if ! iptables -C FORWARD -i {{ wan2_interface }} -o {{ trunk_interface }}.{{ item.id }} -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null; then
          iptables -A FORWARD -i {{ wan2_interface }} -o {{ trunk_interface }}.{{ item.id }} -m state --state RELATED,ESTABLISHED -j ACCEPT
          changed=1
        fi
        [ $changed -eq 1 ] && echo "ADDED" || echo "EXISTS"
      loop: "{{ vlans }}"
      args:
        executable: /bin/bash
      register: ret_wan_vlan
      changed_when: "'ADDED' in ret_wan_vlan.stdout"

    # --- Politicas inter-VLAN ---
    - name: Permitir trabajadores (VLAN20) acceder a servidores (VLAN10)
      ansible.builtin.shell: |
        if iptables -C FORWARD -i {{ trunk_interface }}.20 -o {{ trunk_interface }}.10 -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A FORWARD -i {{ trunk_interface }}.20 -o {{ trunk_interface }}.10 -j ACCEPT
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: fwd_v20_v10
      changed_when: "'ADDED' in fwd_v20_v10.stdout"

    - name: Permitir respuestas de servidores (VLAN10) hacia trabajadores (VLAN20)
      ansible.builtin.shell: |
        if iptables -C FORWARD -i {{ trunk_interface }}.10 -o {{ trunk_interface }}.20 -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A FORWARD -i {{ trunk_interface }}.10 -o {{ trunk_interface }}.20 -m state --state RELATED,ESTABLISHED -j ACCEPT
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: fwd_v10_v20
      changed_when: "'ADDED' in fwd_v10_v20.stdout"

    - name: Bloquear invitados (VLAN30) hacia servidores (VLAN10)
      ansible.builtin.shell: |
        if iptables -C FORWARD -i {{ trunk_interface }}.30 -o {{ trunk_interface }}.10 -j DROP 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A FORWARD -i {{ trunk_interface }}.30 -o {{ trunk_interface }}.10 -j DROP
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: drop_v30_v10
      changed_when: "'ADDED' in drop_v30_v10.stdout"

    - name: Bloquear invitados (VLAN30) hacia trabajadores (VLAN20)
      ansible.builtin.shell: |
        if iptables -C FORWARD -i {{ trunk_interface }}.30 -o {{ trunk_interface }}.20 -j DROP 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A FORWARD -i {{ trunk_interface }}.30 -o {{ trunk_interface }}.20 -j DROP
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: drop_v30_v20
      changed_when: "'ADDED' in drop_v30_v20.stdout"

    - name: Permitir trafico VRRP en subinterfaces VLAN
      ansible.builtin.shell: |
        if iptables -C INPUT -i {{ trunk_interface }}.{{ item.id }} -p vrrp -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A INPUT -i {{ trunk_interface }}.{{ item.id }} -p vrrp -j ACCEPT
          echo "ADDED"
        fi
      loop: "{{ vlans }}"
      args:
        executable: /bin/bash
      register: vrrp_input
      changed_when: "'ADDED' in vrrp_input.stdout"

    # --- DHCP Relay ---
    - name: Permitir DHCP relay en interfaces de clientes (INPUT UDP 67)
      ansible.builtin.shell: |
        if iptables -C INPUT -i {{ trunk_interface }}.{{ item.id }} -p udp --dport 67 -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A INPUT -i {{ trunk_interface }}.{{ item.id }} -p udp --dport 67 -j ACCEPT
          echo "ADDED"
        fi
      loop: "{{ vlans | selectattr('id', 'ne', 10) | list }}"
      args:
        executable: /bin/bash
      register: dhcp_input
      changed_when: "'ADDED' in dhcp_input.stdout"

    # --- Firewall INPUT ---
    - name: Permitir trafico establecido y relacionado en INPUT
      ansible.builtin.shell: |
        if iptables -C INPUT -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A INPUT -m state --state RELATED,ESTABLISHED -j ACCEPT
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: input_established
      changed_when: "'ADDED' in input_established.stdout"

    - name: Permitir trafico loopback en INPUT
      ansible.builtin.shell: |
        if iptables -C INPUT -i lo -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A INPUT -i lo -j ACCEPT
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: input_loopback
      changed_when: "'ADDED' in input_loopback.stdout"

    - name: Permitir SSH desde VLAN de servidores (VLAN10)
      ansible.builtin.shell: |
        if iptables -C INPUT -i {{ trunk_interface }}.10 -p tcp --dport 22 -j ACCEPT 2>/dev/null; then
          echo "EXISTS"
        else
          iptables -A INPUT -i {{ trunk_interface }}.10 -p tcp --dport 22 -j ACCEPT
          echo "ADDED"
        fi
      args:
        executable: /bin/bash
      register: input_ssh
      changed_when: "'ADDED' in input_ssh.stdout"

    - name: Establecer politicas por defecto (INPUT DROP, FORWARD DROP)
      ansible.builtin.shell: |
        changed=0
        if [ "$(iptables -S INPUT | head -1)" != "-P INPUT DROP" ]; then
          iptables -P INPUT DROP
          changed=1
        fi
        if [ "$(iptables -S FORWARD | head -1)" != "-P FORWARD DROP" ]; then
          iptables -P FORWARD DROP
          changed=1
        fi
        [ $changed -eq 1 ] && echo "CHANGED" || echo "EXISTS"
      args:
        executable: /bin/bash
      register: default_policies
      changed_when: "'CHANGED' in default_policies.stdout"

    - name: Configurar DHCP relay agent
      ansible.builtin.copy:
        dest: /etc/default/isc-dhcp-relay
        owner: root
        group: root
        mode: "0644"
        content: |
          SERVERS="{{ dhcp_server }}"
          INTERFACES="{% for vlan in vlans if vlan.id != 10 %}{{ trunk_interface }}.{{ vlan.id }}{% if not loop.last %} {% endif %}{% endfor %}"
          OPTIONS=""
      notify: Restart isc-dhcp-relay

    - name: Habilitar e iniciar DHCP relay
      ansible.builtin.systemd:
        name: isc-dhcp-relay
        enabled: true
        state: started

    # --- ECMP ---
    - name: Configurar ECMP multipath routing
      ansible.builtin.shell: |
        ip route replace default scope global \
          nexthop via {{ wan1_gateway }} dev {{ wan_interface }} weight 1 \
          nexthop via {{ wan2_gateway }} dev {{ wan2_interface }} weight 1
      args:
        executable: /bin/bash

    - name: Crear servicio systemd para persistencia ECMP
      ansible.builtin.copy:
        dest: /etc/systemd/system/ecmp-loadbalance.service
        content: |
          [Unit]
          Description=ECMP load balancing for dual WAN
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/sbin/ip route replace default scope global nexthop via {{ wan1_gateway }} dev {{ wan_interface }} weight 1 nexthop via {{ wan2_gateway }} dev {{ wan2_interface }} weight 1
          RemainAfterExit=true

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"

    - name: Habilitar e iniciar servicio ECMP
      ansible.builtin.systemd:
        name: ecmp-loadbalance
        daemon_reload: true
        enabled: true
        state: started

    # --- VRRP por VLAN ---
    - name: Configurar keepalived con una instancia por VLAN
      ansible.builtin.copy:
        dest: /etc/keepalived/keepalived.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          {% for vlan in vlans %}
          vrrp_instance VLAN{{ vlan.id }}_VIP {
              state {{ vrrp_state }}
              interface {{ trunk_interface }}.{{ vlan.id }}
              virtual_router_id {{ vlan.vrrp_id }}
              priority {{ vrrp_priority }}
              advert_int 1

              authentication {
                  auth_type PASS
                  auth_pass {{ vrrp_auth_pass }}
              }

              virtual_ipaddress {
                  {{ vlan.vip }} dev {{ trunk_interface }}.{{ vlan.id }}
              }
          }

          {% endfor %}
      notify: Restart keepalived

    - name: Iniciar y habilitar keepalived
      ansible.builtin.systemd:
        name: keepalived
        enabled: true
        state: started

    - name: Guardar reglas iptables
      ansible.builtin.shell: netfilter-persistent save
      args:
        executable: /bin/bash
      changed_when: false

  handlers:
    - name: Apply netplan
      ansible.builtin.shell: netplan generate && netplan apply
      args:
        executable: /bin/bash


    - name: Restart keepalived
      ansible.builtin.systemd:
        name: keepalived
        state: restarted

    - name: Restart isc-dhcp-relay
      ansible.builtin.systemd:
        name: isc-dhcp-relay
        state: restarted
