---
- name: Configurar Ubuntu Router BACKUP con balanceo ECMP, VRRP y VLANs
  hosts: ubuntu_router_backup
  become: true

  vars:
    wan_interface: ens34
    wan1_address: "172.17.25.62/24"
    wan1_gateway: "172.17.25.121"
    wan2_interface: ens35
    wan2_address: "168.17.25.3/29"
    wan2_gateway: "168.17.25.1"

    # Trunk LAN - sin IP propia
    trunk_interface: ens38

    # VLANs
    vlans:
      - id: 10
        name: servidores
        address: "192.168.10.3/24"
        vip: "192.168.10.1/24"
        vrrp_id: 10
      - id: 20
        name: trabajadores
        address: "192.168.20.3/24"
        vip: "192.168.20.1/24"
        vrrp_id: 20
      - id: 30
        name: invitados
        address: "192.168.30.3/24"
        vip: "192.168.30.1/24"
        vrrp_id: 30

    vrrp_state: BACKUP
    vrrp_priority: 100
    vrrp_auth_pass: VRRP_PASS_2024
    netplan_file: /etc/netplan/50-cloud-init.yaml
    nameservers:
      - "8.8.8.8"
      - "1.1.1.1"
      - "192.168.13.96"
      - "192.168.13.97"

  tasks:
    - name: Instalar paquetes necesarios
      ansible.builtin.apt:
        name:
          - iptables
          - iptables-persistent
          - netfilter-persistent
          - keepalived
          - vlan
        state: present
        update_cache: true

    - name: Cargar modulo 8021q para VLANs
      community.general.modprobe:
        name: 8021q
        state: present

    - name: Persistir modulo 8021q
      ansible.builtin.lineinfile:
        path: /etc/modules
        line: 8021q
        state: present

    - name: Escribir netplan con trunk y subinterfaces VLAN
      ansible.builtin.copy:
        dest: "{{ netplan_file }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              {{ wan_interface }}:
                dhcp4: false
                addresses: [{{ wan1_address }}]
                nameservers:
                  addresses: {{ nameservers | to_json }}
              {{ wan2_interface }}:
                dhcp4: false
                addresses: [{{ wan2_address }}]
              {{ trunk_interface }}:
                dhcp4: false
            vlans:
              {{ trunk_interface }}.10:
                id: 10
                link: {{ trunk_interface }}
                dhcp4: false
                addresses: [192.168.10.3/24]
              {{ trunk_interface }}.20:
                id: 20
                link: {{ trunk_interface }}
                dhcp4: false
                addresses: [192.168.20.3/24]
              {{ trunk_interface }}.30:
                id: 30
                link: {{ trunk_interface }}
                dhcp4: false
                addresses: [192.168.30.3/24]
      notify: Apply netplan

    - name: Forzar aplicacion de netplan antes de continuar
      ansible.builtin.meta: flush_handlers

    - name: Activar IPv4 forwarding
      ansible.builtin.lineinfile:
        path: /etc/sysctl.conf
        regexp: '^#?\s*net\.ipv4\.ip_forward\s*='
        line: 'net.ipv4.ip_forward=1'
        state: present
      notify: Apply sysctl

    - name: Aplicar IPv4 forwarding inmediatamente
      ansible.builtin.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        reload: true

    # --- NAT hacia WAN ---
    - name: NAT MASQUERADE WAN1
      ansible.builtin.shell: |
        iptables -t nat -C POSTROUTING -o {{ wan_interface }} -j MASQUERADE || \
        iptables -t nat -A POSTROUTING -o {{ wan_interface }} -j MASQUERADE
      args:
        executable: /bin/bash

    - name: NAT MASQUERADE WAN2
      ansible.builtin.shell: |
        iptables -t nat -C POSTROUTING -o {{ wan2_interface }} -j MASQUERADE || \
        iptables -t nat -A POSTROUTING -o {{ wan2_interface }} -j MASQUERADE
      args:
        executable: /bin/bash

    # --- FORWARD VLANs hacia WAN ---
    - name: Permitir forwarding VLAN hacia WAN
      ansible.builtin.shell: |
        iptables -C FORWARD -i {{ trunk_interface }}.{{ item.id }} -o {{ wan_interface }} -j ACCEPT || \
        iptables -A FORWARD -i {{ trunk_interface }}.{{ item.id }} -o {{ wan_interface }} -j ACCEPT
        iptables -C FORWARD -i {{ trunk_interface }}.{{ item.id }} -o {{ wan2_interface }} -j ACCEPT || \
        iptables -A FORWARD -i {{ trunk_interface }}.{{ item.id }} -o {{ wan2_interface }} -j ACCEPT
      loop: "{{ vlans }}"
      args:
        executable: /bin/bash

    - name: Permitir trafico de retorno WAN hacia VLANs
      ansible.builtin.shell: |
        iptables -C FORWARD -i {{ wan_interface }} -o {{ trunk_interface }}.{{ item.id }} -m state --state RELATED,ESTABLISHED -j ACCEPT || \
        iptables -A FORWARD -i {{ wan_interface }} -o {{ trunk_interface }}.{{ item.id }} -m state --state RELATED,ESTABLISHED -j ACCEPT
        iptables -C FORWARD -i {{ wan2_interface }} -o {{ trunk_interface }}.{{ item.id }} -m state --state RELATED,ESTABLISHED -j ACCEPT || \
        iptables -A FORWARD -i {{ wan2_interface }} -o {{ trunk_interface }}.{{ item.id }} -m state --state RELATED,ESTABLISHED -j ACCEPT
      loop: "{{ vlans }}"
      args:
        executable: /bin/bash

    # --- Politicas inter-VLAN ---
    - name: Permitir trabajadores (VLAN20) acceder a servidores (VLAN10)
      ansible.builtin.shell: |
        iptables -C FORWARD -i {{ trunk_interface }}.20 -o {{ trunk_interface }}.10 -j ACCEPT || \
        iptables -A FORWARD -i {{ trunk_interface }}.20 -o {{ trunk_interface }}.10 -j ACCEPT
      args:
        executable: /bin/bash

    - name: Permitir respuestas de servidores (VLAN10) hacia trabajadores (VLAN20)
      ansible.builtin.shell: |
        iptables -C FORWARD -i {{ trunk_interface }}.10 -o {{ trunk_interface }}.20 -m state --state RELATED,ESTABLISHED -j ACCEPT || \
        iptables -A FORWARD -i {{ trunk_interface }}.10 -o {{ trunk_interface }}.20 -m state --state RELATED,ESTABLISHED -j ACCEPT
      args:
        executable: /bin/bash

    - name: Bloquear invitados (VLAN30) hacia servidores (VLAN10)
      ansible.builtin.shell: |
        iptables -C FORWARD -i {{ trunk_interface }}.30 -o {{ trunk_interface }}.10 -j DROP || \
        iptables -A FORWARD -i {{ trunk_interface }}.30 -o {{ trunk_interface }}.10 -j DROP
      args:
        executable: /bin/bash

    - name: Bloquear invitados (VLAN30) hacia trabajadores (VLAN20)
      ansible.builtin.shell: |
        iptables -C FORWARD -i {{ trunk_interface }}.30 -o {{ trunk_interface }}.20 -j DROP || \
        iptables -A FORWARD -i {{ trunk_interface }}.30 -o {{ trunk_interface }}.20 -j DROP
      args:
        executable: /bin/bash

    - name: Permitir trafico VRRP en subinterfaces VLAN
      ansible.builtin.shell: |
        iptables -C INPUT -i {{ trunk_interface }}.{{ item.id }} -p vrrp -j ACCEPT || \
        iptables -A INPUT -i {{ trunk_interface }}.{{ item.id }} -p vrrp -j ACCEPT
      loop: "{{ vlans }}"
      args:
        executable: /bin/bash

    # --- ECMP ---
    - name: Configurar ECMP multipath routing
      ansible.builtin.shell: |
        ip route replace default scope global \
          nexthop via {{ wan1_gateway }} dev {{ wan_interface }} weight 1 \
          nexthop via {{ wan2_gateway }} dev {{ wan2_interface }} weight 1
      args:
        executable: /bin/bash

    - name: Crear servicio systemd para persistencia ECMP
      ansible.builtin.copy:
        dest: /etc/systemd/system/ecmp-loadbalance.service
        content: |
          [Unit]
          Description=ECMP load balancing for dual WAN
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/sbin/ip route replace default scope global nexthop via {{ wan1_gateway }} dev {{ wan_interface }} weight 1 nexthop via {{ wan2_gateway }} dev {{ wan2_interface }} weight 1
          RemainAfterExit=true

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"

    - name: Habilitar e iniciar servicio ECMP
      ansible.builtin.systemd:
        name: ecmp-loadbalance
        daemon_reload: true
        enabled: true
        state: started

    # --- VRRP por VLAN ---
    - name: Configurar keepalived con una instancia por VLAN
      ansible.builtin.copy:
        dest: /etc/keepalived/keepalived.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          {% for vlan in vlans %}
          vrrp_instance VLAN{{ vlan.id }}_VIP {
              state {{ vrrp_state }}
              interface {{ trunk_interface }}.{{ vlan.id }}
              virtual_router_id {{ vlan.vrrp_id }}
              priority {{ vrrp_priority }}
              advert_int 1

              authentication {
                  auth_type PASS
                  auth_pass {{ vrrp_auth_pass }}
              }

              virtual_ipaddress {
                  {{ vlan.vip }} dev {{ trunk_interface }}.{{ vlan.id }}
              }
          }

          {% endfor %}
      notify: Restart keepalived

    - name: Iniciar y habilitar keepalived
      ansible.builtin.systemd:
        name: keepalived
        enabled: true
        state: started

    - name: Guardar reglas iptables
      ansible.builtin.shell: netfilter-persistent save
      args:
        executable: /bin/bash

  handlers:
    - name: Apply netplan
      ansible.builtin.shell: netplan generate && netplan apply
      args:
        executable: /bin/bash

    - name: Apply sysctl
      ansible.builtin.command: sysctl -p

    - name: Restart keepalived
      ansible.builtin.systemd:
        name: keepalived
        state: restarted
