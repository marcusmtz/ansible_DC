---
- name: Configurar ISP2_creator como router NAT sin tocar la WAN
  hosts: isp2_creator
  become: true

  vars:
    wan_interface: ens34
    lan_interface: ens35
    lan_address: "168.17.25.1/29"
    netplan_file: /etc/netplan/50-cloud-init.yaml

    nameservers:
      - "8.8.8.8"
      - "1.1.1.1"
      - "192.168.13.96"
      - "192.168.13.97"

  tasks:
    # Validación de prerrequisitos
    - name: Verificar que las interfaces de red existen
      ansible.builtin.stat:
        path: "/sys/class/net/{{ item }}"
      register: interface_check
      failed_when: not interface_check.stat.exists
      loop:
        - "{{ wan_interface }}"
        - "{{ lan_interface }}"
      tags:
        - validation
        - network

    - name: Verificar que el archivo netplan existe
      ansible.builtin.stat:
        path: "{{ netplan_file }}"
      register: netplan_check
      failed_when: not netplan_check.stat.exists
      tags:
        - validation
        - netplan

    # Instalación de paquetes
    - name: Instalar paquetes necesarios para routing y NAT
      ansible.builtin.apt:
        name:
          - iptables
          - iptables-persistent
          - netfilter-persistent
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags:
        - packages
        - firewall

    # Configuración de red con netplan
    - name: Leer configuración netplan actual
      ansible.builtin.slurp:
        path: "{{ netplan_file }}"
      register: netplan_raw
      tags:
        - netplan
        - network

    - name: Parsear configuración netplan actual
      ansible.builtin.set_fact:
        netplan_current: "{{ netplan_raw.content | b64decode | from_yaml }}"
      tags:
        - netplan
        - network

    - name: Crear copia de seguridad de netplan antes de modificar
      ansible.builtin.copy:
        src: "{{ netplan_file }}"
        dest: "{{ netplan_file }}.backup.{{ ansible_date_time.epoch }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      tags:
        - netplan
        - network
        - backup

    - name: Configurar interfaz LAN en netplan
      ansible.builtin.copy:
        dest: /etc/netplan/99-isp2-lan.yaml
        owner: root
        group: root
        mode: "0644"
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              {{ lan_interface }}:
                dhcp4: false
                addresses:
                  - {{ lan_address }}
      notify: Validar y aplicar netplan
      tags:
        - netplan
        - network

    - name: Agregar nameservers a interfaz WAN en netplan
      ansible.builtin.copy:
        dest: /etc/netplan/99-isp2-wan-dns.yaml
        owner: root
        group: root
        mode: "0644"
        content: |
          network:
            version: 2
            ethernets:
              {{ wan_interface }}:
                nameservers:
                  addresses:
                    {% for ns in nameservers %}
                    - {{ ns }}
                    {% endfor %}
      notify: Validar y aplicar netplan
      tags:
        - netplan
        - network
        - dns

    # Configuración de IP forwarding
    - name: Activar IPv4 forwarding de forma persistente
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        sysctl_file: /etc/sysctl.d/99-router.conf
        reload: true
      tags:
        - sysctl
        - routing

    # Configuración de firewall con iptables-persistent
    - name: Crear directorio para reglas iptables si no existe
      ansible.builtin.file:
        path: /etc/iptables
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags:
        - firewall

    - name: Configurar reglas NAT en iptables
      ansible.builtin.iptables:
        table: nat
        chain: POSTROUTING
        out_interface: "{{ wan_interface }}"
        jump: MASQUERADE
        comment: "NAT para ISP2 LAN"
      notify: Guardar reglas iptables
      tags:
        - firewall
        - nat

    - name: Permitir forwarding de LAN hacia WAN
      ansible.builtin.iptables:
        chain: FORWARD
        in_interface: "{{ lan_interface }}"
        out_interface: "{{ wan_interface }}"
        jump: ACCEPT
        comment: "Permitir trafico LAN a WAN"
      notify: Guardar reglas iptables
      tags:
        - firewall
        - forwarding

    - name: Permitir trafico establecido de WAN hacia LAN
      ansible.builtin.iptables:
        chain: FORWARD
        in_interface: "{{ wan_interface }}"
        out_interface: "{{ lan_interface }}"
        ctstate: ESTABLISHED,RELATED
        jump: ACCEPT
        comment: "Permitir respuestas WAN a LAN"
      notify: Guardar reglas iptables
      tags:
        - firewall
        - forwarding

    - name: Establecer politica por defecto DROP en FORWARD
      ansible.builtin.iptables:
        chain: FORWARD
        policy: DROP
      notify: Guardar reglas iptables
      tags:
        - firewall
        - security

  handlers:
    - name: Validar y aplicar netplan
      ansible.builtin.command:
        cmd: netplan generate && netplan apply
      changed_when: true

    - name: Guardar reglas iptables
      ansible.builtin.command:
        cmd: netfilter-persistent save
      changed_when: true

